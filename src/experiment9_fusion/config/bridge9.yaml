# Gazebo Fortress <-> ROS 2 桥接。话题名全部沿用实验5/实验7，
# 只新增了深度图、相机内参、碰撞标志和 /odom 四项。
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS

# 仿真 Mid-360（CPU 光线投射，逐点带 offset_time），坐标系 lidar_frame
- ros_topic_name: /livox/points
  gz_topic_name: /r1/sim/lidar_points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: ignition.msgs.PointCloudPacked
  direction: GZ_TO_ROS

- ros_topic_name: /r1/sim/imu_raw
  gz_topic_name: /r1/sim/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: ignition.msgs.IMU
  direction: GZ_TO_ROS

# 仿真里程计 = 运动系统报告的真实位姿。本实验不设第二个真值话题：
# 同一条 gz 话题挂两次桥接没有必要，而且重复订阅会让桥接在整个实验室里
# 变成一个说不清的故障点。
- ros_topic_name: /odom
  gz_topic_name: /r1/sim/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: ignition.msgs.Odometry
  direction: GZ_TO_ROS

- ros_topic_name: /r1/cmd_vel
  gz_topic_name: /r1/sim/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: ignition.msgs.Twist
  direction: ROS_TO_GZ

- ros_topic_name: /r1/lidar/source_status
  gz_topic_name: /r1/sim/lidar_status
  ros_type_name: std_msgs/msg/String
  gz_type_name: ignition.msgs.StringMsg
  direction: GZ_TO_ROS

# 平面运动系统的碰撞计数：Nav2 让它往前开、2D 保护判据拦住它时置 true
- ros_topic_name: /r1/collision_blocked
  gz_topic_name: /r1/sim/collision_blocked
  ros_type_name: std_msgs/msg/Bool
  gz_type_name: ignition.msgs.Boolean
  direction: GZ_TO_ROS

# 深度相机：160x120、R_FLOAT32、2 Hz，坐标系 depth_camera_optical_frame
- ros_topic_name: /r1/depth/image
  gz_topic_name: /r1/depth/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
  direction: GZ_TO_ROS
  lazy: false
  subscriber_queue: 2
  publisher_queue: 2

- ros_topic_name: /r1/depth/camera_info
  gz_topic_name: /r1/depth/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: ignition.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: false
  subscriber_queue: 2
  publisher_queue: 2
