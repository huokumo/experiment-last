# Nav2 参数：为这台 0.45 m 半径、限速 0.25 m/s 的 R1 专门调过。
#
# 与本实验相关的只有四处，学生排障时先看这四处：
#   1. observation_sources.cloud.topic = /r1/fusion/points  （融合结果进代价地图的唯一入口）
#   2. obstacle 层的 min/max_obstacle_height            （与 fusion.yaml 的 z_min/z_max 一致）
#   3. robot_radius = 0.45                              （与仿真 2D 保护判据一致）
#   4. inflation_radius = 0.90 / cost_scaling_factor = 1.5
#      这个"软圈"比车身大得多，作用是让全局规划走在通道中间而不是贴着障碍边缘。
#      原来是 0.55 / 3.0，圈只有 0.10 m 宽，规划出来的路径紧贴障碍 0.45 m；
#      而仿真的 2D 保护判据按"方形膨胀"算（每个轴各让 0.45），拐角处比圆形
#      模型多要 0.19 m，于是路径在拐角处被保护判据判撞；RViz 里看不到任何
#      异常，车就在空地上原地打转、recoveries 一直涨、distance_remaining 不动。
#      改大软圈后路径最小离障碍 0.73 m，两个模型都接受。
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    transform_tolerance: 1.0

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.30
      movement_time_allowance: 25.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.50
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.22
      lookahead_dist: 0.55
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.85
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.95
      regulated_linear_scaling_min_speed: 0.10
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.60
      rotate_to_heading_angular_vel: 0.45
      max_angular_accel: 0.80
      allow_reversing: false
      transform_tolerance: 1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.30
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.45
    min_rotational_vel: 0.10
    rotational_acc_lim: 0.80

map_server:
  ros__parameters:
    use_sim_time: true
    topic_name: map
    frame_id: map
    yaml_filename: ""

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.45
      transform_tolerance: 1.0
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: cloud
        cloud:
          topic: /r1/fusion/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 5.0
          raytrace_min_range: 0.0
          raytrace_max_range: 6.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.5
        inflation_radius: 0.90
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.45
      track_unknown_space: false
      transform_tolerance: 1.0
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: cloud
        cloud:
          topic: /r1/fusion/points
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 9.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.5
        inflation_radius: 0.90
      always_send_full_costmap: true
